
[workspace.package]
version = "0.1.0"
edition = "2024"


[workspace]
members = ["app/*", "crates/*"]
resolver = "2"


[workspace.dependencies]
axum = "0.7"
async-trait = "0.1"
tokio = { version = "1" }
serde = { version = "1" }
serde_json = "1"
config = { version = "0.15.22" }
chrono = "0.4"
humantime = "2"

bcrypt = "0.19.0"
jsonwebtoken = "9"

# db
sqlx = { version = "0.8", features = [
    "postgres",
    "runtime-tokio",
    "uuid",
    "chrono",
] }
uuid = { version = "1", features = ["v4"] }
